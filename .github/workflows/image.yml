name: Verify and build image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segscope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify parsers, address history and pinned runner
        run: |
          node scripts/check-imports.mjs
          python3 scripts/build-runner.py
          git diff --exit-code -- server/assets/runner.tar.gz
          go build -o "$RUNNER_TEMP/segscope-server" ./server
          go vet ./server
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for default-branch publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/segscope:0.3.0
            ghcr.io/${{ github.repository_owner }}/segscope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
